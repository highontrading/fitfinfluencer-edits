<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --gold:#FFC53D; --gold2:#FF9F1C; --red:#FF4D5E; --green:#37F59B; --ink:#0B0D12; --glass:rgba(12,14,20,.80); --line:rgba(255,255,255,.14); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:1920px; background:transparent; overflow:hidden; }
  body { font-family:'Montserrat','Poppins',sans-serif; color:#fff; -webkit-font-smoothing:antialiased; }
  .layer { position:absolute; inset:0; }
  .ev { position:absolute; left:0; top:0; width:1080px; opacity:0; will-change:transform,opacity; }

  /* captions */
  #cap { position:absolute; left:60px; right:60px; text-align:center; }
  #cap .page { position:absolute; left:0; right:0; display:flex; flex-wrap:wrap; justify-content:center; gap:0 34px; }
  .cw { font-weight:900; font-size:84px; line-height:1.08; text-transform:uppercase; letter-spacing:-1px;
        -webkit-text-stroke:0; paint-order:stroke fill; display:inline-block;
        text-shadow:0 6px 0 rgba(0,0,0,.55), 0 0 28px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.9); }
  .cw.hl { color:var(--gold); }
  .cw.on { color:var(--gold); }
  .cw.hl.on { color:#fff; background:linear-gradient(180deg,var(--gold),var(--gold2)); border-radius:14px; padding:0 14px; color:#111; text-shadow:none; }

  /* glass card */
  .card { background:linear-gradient(160deg, rgba(28,31,40,.92), rgba(10,12,17,.90)); border:2px solid var(--line);
          border-radius:36px; box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); }
  .kicker { font-family:Poppins; font-weight:600; font-size:30px; letter-spacing:6px; text-transform:uppercase; color:var(--gold); }
  .acc { color:var(--gold); }
  .red { color:var(--red); } .green { color:var(--green); }

  /* title */
  .title { text-align:center; padding:0 70px; }
  .title .ln { display:block; font-weight:900; text-transform:uppercase; letter-spacing:-2px; line-height:1.02; }
  .title .w { display:inline-block; margin:0 10px; }
  .title .shadow { text-shadow:0 8px 30px rgba(0,0,0,.6), 0 3px 0 rgba(0,0,0,.4); }
  .title .plate { display:inline-block; padding:26px 44px 30px; }

  /* chips */
  .chips { display:flex; flex-direction:column; align-items:center; gap:22px; }
  .chip { display:flex; align-items:center; gap:22px; padding:20px 40px 20px 22px; border-radius:999px; font-family:Poppins; font-weight:700; font-size:46px; }
  .chip .ic { width:78px; height:78px; border-radius:50%; display:grid; place-items:center; font-size:44px; background:rgba(255,197,61,.16); border:2px solid rgba(255,197,61,.45); }

  /* checklist */
  .check { margin:0 auto; width:880px; padding:40px 48px; }
  .check .row { display:flex; align-items:center; justify-content:space-between; padding:20px 6px; border-bottom:2px solid rgba(255,255,255,.08); font-family:Poppins; font-weight:700; font-size:52px; }
  .check .row:last-child { border-bottom:0; }
  .check .row .lbl span { color:rgba(255,255,255,.55); font-weight:500; }
  .mark { width:70px; height:70px; }

  /* flow */
  .flow { position:relative; margin:0 auto; }
  .node { position:absolute; display:flex; align-items:center; gap:18px; padding:22px 32px; border-radius:30px; font-family:Poppins; font-weight:700; font-size:46px; white-space:nowrap; line-height:1.1; }
  .node .ic { font-size:46px; }
  .node .num { width:60px; height:60px; border-radius:50%; background:var(--gold); color:#111; font-weight:800; font-size:34px; display:grid; place-items:center; flex:none; }
  .node .sub { display:block; font-weight:500; font-size:29px; color:rgba(255,255,255,.65); margin-top:2px; }
  .node.target { background:linear-gradient(180deg,#FFD36B,var(--gold2)); color:#111; border:0; font-weight:800; }
  .node.target .sub { color:rgba(0,0,0,.6); }
  svg.wires { position:absolute; left:0; top:0; overflow:visible; }
  svg.wires path { fill:none; stroke:var(--gold); stroke-width:6; stroke-linecap:round; filter:drop-shadow(0 0 8px rgba(255,197,61,.6)); }

  /* stat */
  .stat { text-align:center; }
  .stat .big { font-weight:900; font-size:220px; line-height:.95; letter-spacing:-6px; }
  .stat .unit { font-size:90px; letter-spacing:-2px; margin-left:8px; }
  .stat .lbl { font-family:Poppins; font-weight:700; font-size:42px; letter-spacing:4px; text-transform:uppercase; margin-top:10px; }
  .stat .from { font-family:Poppins; font-weight:600; font-size:54px; color:rgba(255,255,255,.55); }
  .stat .from s { text-decoration-thickness:6px; text-decoration-color:var(--red); }
  .pill { display:inline-flex; align-items:center; gap:12px; padding:12px 28px; border-radius:999px; font-family:Poppins; font-weight:800; font-size:38px; }
  .pill.down { background:rgba(55,245,155,.16); color:var(--green); border:2px solid rgba(55,245,155,.5); }
  .pill.up { background:rgba(255,77,94,.16); color:var(--red); border:2px solid rgba(255,77,94,.5); }

  /* compare */
  .cmp { display:flex; gap:34px; justify-content:center; align-items:flex-end; }
  .col { width:430px; padding:36px 30px; text-align:center; }
  .col .k { font-family:Poppins; font-weight:600; font-size:30px; letter-spacing:4px; text-transform:uppercase; color:rgba(255,255,255,.6); }
  .col .v { font-weight:900; font-size:100px; letter-spacing:-3px; line-height:1.05; }
  .col .barw { height:300px; display:flex; align-items:flex-end; justify-content:center; margin-top:18px; }
  .col .bar { width:150px; border-radius:22px 22px 10px 10px; }

  /* badge */
  .badge { display:inline-flex; align-items:center; gap:22px; padding:26px 48px; border-radius:999px; font-family:Poppins; font-weight:800; font-size:54px; letter-spacing:4px; text-transform:uppercase; }
  .dot { width:28px; height:28px; border-radius:50%; background:#FF3347; box-shadow:0 0 0 0 rgba(255,51,71,.7); }

  /* chain */
  .chain { position:relative; width:900px; margin:0 auto; }
  .link { position:absolute; left:0; right:0; height:118px; display:flex; align-items:center; gap:24px; padding:0 34px; border-radius:30px; font-family:Poppins; font-weight:700; font-size:46px; }
  .link .ic { width:76px; height:76px; border-radius:22px; display:grid; place-items:center; font-size:44px; background:rgba(255,255,255,.07); flex:none; }
  .link .st { margin-left:auto; font-size:40px; font-weight:800; }
  .link.cur { background:linear-gradient(180deg,#FFD36B,var(--gold2)); color:#111; border:0; }
  .link.cur .ic { background:rgba(0,0,0,.12); }
  .link.cur .acc, .node.target .acc { color:#7A1F00; }

  /* cta */
  .cta { position:absolute; inset:0; }
  .cta .shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,6,9,.0) 0%, rgba(5,6,9,.55) 38%, rgba(5,6,9,.94) 70%); }
  .cta .box { position:absolute; left:70px; right:70px; text-align:center; }
  .cta h1 { font-weight:900; font-size:104px; line-height:1.0; letter-spacing:-3px; text-transform:uppercase; }
  .cta p { font-family:Poppins; font-weight:600; font-size:40px; color:rgba(255,255,255,.75); margin-top:22px; }
  .btn { position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:22px; margin-top:44px; padding:34px 64px; border-radius:999px;
         background:linear-gradient(180deg,#FFD66E,var(--gold2)); color:#121212; font-family:Poppins; font-weight:800; font-size:52px; letter-spacing:1px;
         box-shadow:0 20px 60px rgba(255,159,28,.45), inset 0 2px 0 rgba(255,255,255,.6); }
  .btn .shine { position:absolute; top:-20%; bottom:-20%; width:120px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent); transform:skewX(-20deg); }
  .arrow { font-size:90px; margin-top:24px; display:block; }

  /* misc */
  #flash { position:absolute; inset:0; background:#fff; opacity:0; }
  #leak { position:absolute; inset:-200px; opacity:0; background:radial-gradient(closest-side, rgba(255,170,60,.85), rgba(255,90,40,.35) 45%, transparent 75%); mix-blend-mode:screen; }
  #prog { position:absolute; left:0; top:0; height:10px; background:linear-gradient(90deg,var(--gold2),var(--gold)); box-shadow:0 0 14px rgba(255,197,61,.8); }
  #brand { position:absolute; left:40px; top:44px; padding:12px 26px 12px 18px; border-radius:999px; background:rgba(10,12,17,.62); border:1.5px solid rgba(255,255,255,.16); font-family:Poppins; font-weight:700; font-size:30px; letter-spacing:.5px; opacity:0; display:flex; align-items:center; gap:12px; }
  #brand b { color:var(--gold); }
  #brand i { width:14px; height:14px; border-radius:50%; background:var(--gold); box-shadow:0 0 12px rgba(255,197,61,.9); display:inline-block; }
  #vig { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.38) 100%); }
  /* layers: text behind the speaker is rendered in a separate pass */
  body[data-layer=behind] #vig, body[data-layer=behind] #cap, body[data-layer=behind] #leak, body[data-layer=behind] #flash,
  body[data-layer=behind] #prog, body[data-layer=behind] #brand, body[data-layer=behind] #cine, body[data-layer=behind] .ev:not(.bh) { visibility:hidden; }
  body[data-layer=front] .bh { visibility:hidden; }
  /* kinetic free-position text */
  .kin { position:absolute; width:auto; white-space:nowrap; }
  .kin .ln { display:block; line-height:.95; }
  .kin .w { display:inline-block; margin:0 .12em; }
  .f-bebas { font-family:'Bebas Neue','Anton',sans-serif; font-weight:400; letter-spacing:2px; }
  .f-anton { font-family:'Anton',sans-serif; letter-spacing:1px; text-transform:uppercase; }
  .f-oswald { font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:1px; }
  .f-serif { font-family:'Playfair Display',serif; font-style:italic; font-weight:900; letter-spacing:-1px; }
  .f-inter { font-family:'Inter Display','Inter',sans-serif; font-weight:900; letter-spacing:-2px; text-transform:uppercase; }
  .f-mono { font-family:'JetBrains Mono',monospace; font-weight:800; letter-spacing:2px; text-transform:uppercase; }
  .sh1 { text-shadow:0 10px 40px rgba(0,0,0,.55), 0 3px 0 rgba(0,0,0,.35); }
  .outline { color:transparent !important; -webkit-text-stroke:3px rgba(255,255,255,.92); text-shadow:none; }
  .num-ic { font-family:'Bebas Neue',sans-serif; font-size:52px; color:var(--gold); background:transparent !important; border:2px solid rgba(255,197,61,.55) !important; }
  .ic img { width:100%; height:100%; object-fit:cover; border-radius:inherit; }
  .chip .ic.num-ic { font-size:46px; }
  /* stamp (MYTH / FACT) */
  .stamp { display:inline-block; padding:18px 40px; border:8px solid currentColor; border-radius:18px; font-family:'Bebas Neue',sans-serif; font-size:150px; line-height:1; letter-spacing:6px; }
  /* callout */
  .callout { position:absolute; left:0; top:0; }
  .callout .lab { position:absolute; font-family:'Oswald',sans-serif; font-weight:700; font-size:44px; letter-spacing:3px; text-transform:uppercase; padding:10px 22px; background:rgba(8,10,14,.78); border:2px solid var(--gold); border-radius:12px; white-space:nowrap; }
  .callout svg { position:absolute; left:0; top:0; overflow:visible; }
  /* ECG monitor */
  .ecg { position:absolute; border-radius:26px; overflow:hidden; background:#030806; border:3px solid rgba(57,255,136,.35); box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 60px rgba(57,255,136,.08); }
  .ecg canvas { position:absolute; left:0; top:0; }
  .ecg .hud { position:absolute; right:30px; top:22px; text-align:right; font-family:'JetBrains Mono',monospace; color:#39FF88; text-shadow:0 0 14px rgba(57,255,136,.8); }
  .ecg .hud .bpm { font-size:120px; font-weight:800; line-height:1; }
  .ecg .hud .u { font-size:30px; font-weight:700; letter-spacing:4px; }
  .ecg .tag { position:absolute; left:30px; top:26px; font-family:'JetBrains Mono',monospace; font-weight:800; font-size:30px; letter-spacing:4px; color:#39FF88; }
  .ecg .hrt { position:absolute; right:34px; bottom:26px; width:54px; height:48px; }
  /* cinematic letterbox */
  #cine { position:absolute; inset:0; pointer-events:none; }
  #cine .bar { position:absolute; left:0; right:0; height:0; background:#000; }
  .chev { width:90px; height:60px; margin:26px auto 0; display:block; }
  .slam { text-align:center; font-weight:900; text-transform:uppercase; letter-spacing:-3px; line-height:1; }
</style></head>
<body>
<div id="vig"></div>
<div class="layer" id="evs"></div>
<div id="cap"></div>
<div id="leak"></div>
<div id="flash"></div>
<div id="prog"></div>
<div id="brand"></div>
<div id="cine"><div class="bar" style="top:0"></div><div class="bar" style="bottom:0"></div></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const E={
  outCubic:t=>1-Math.pow(1-t,3), inCubic:t=>t*t*t, outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outBack:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  spring:t=>t>=1?1:1-Math.exp(-6*t)*Math.cos(10*t),
};
const P=(t,t0,d)=>clamp((t-t0)/d);
const h=(tag,cls,html)=>{const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e;};
// highlight *word* syntax -> gold
const icon=(it,i)=>it.img?`<span class="ic"><img src="${it.img}"></span>`:(it.num===false?'':`<span class="ic num-ic">${it.num??(i+1)}</span>`);
const GL={up:'<svg width="44" height="44" viewBox="0 0 44 44"><path d="M22 6 L38 26 H28 V38 H16 V26 H6 Z" fill="currentColor"/></svg>',
  down:'<svg width="44" height="44" viewBox="0 0 44 44"><path d="M22 38 L38 18 H28 V6 H16 V18 H6 Z" fill="currentColor"/></svg>',
  yes:'<svg width="44" height="44" viewBox="0 0 44 44"><path d="M8 23 L18 33 L36 12" stroke="currentColor" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  no:'<svg width="44" height="44" viewBox="0 0 44 44"><path d="M10 10 L34 34 M34 10 L10 34" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg>'};
const glyph=s=>GL[s]||s;
const fmt=s=>s.replace(/\*([^*]+)\*/g,'<span class="acc">$1</span>').replace(/~([^~]+)~/g,'<span class="red">$1</span>').replace(/\^([^\^]+)\^/g,'<span class="green">$1</span>');

let SPEC=null; const comps=[];
// generic enter/exit envelope for an event
function env(ev,t,inD=.35,outD=.3){ if(t<ev.t0||t>ev.t1) return 0; const a=E.outCubic(P(t,ev.t0,inD)); const b=1-E.inCubic(P(t,ev.t1-outD,outD)); return Math.min(a,b); }
function place(el,ev){ el.style.top=(ev.y||0)+'px'; }

const C={};
C.title={
  build(ev){ const el=h('div','ev title'); const box=h('div', ev.plate?'plate card':''); box.style.display='inline-block';
    let i=0; ev.words=[];
    ev.lines.forEach((ln,li)=>{ const l=h('span','ln'+(ev.plate?'':' shadow')); l.style.fontSize=((ev.sizes&&ev.sizes[li])||ev.size||110)+'px';
      let st=null; ln.split(' ').forEach(w=>{ let open=null; for(const m of ['*','~','^']){ if(w.startsWith(m)&&!st){ st=m; w=w.slice(1); } }
        let close=false, tail=''; const mt=w.match(/^(.*?)([*~^])([?!.,"'’]*)$/); if(st&&mt&&mt[2]===st){ w=mt[1]; tail=mt[3]; close=true; }
        const cls=st==='*'?'acc':st==='~'?'red':st==='^'?'green':''; const s=h('span','w',(cls?`<span class="${cls}">${w}</span>`:w)+tail); if(close) st=null;
        l.appendChild(s); ev.words.push(s); }); box.appendChild(l); });
    if(ev.kicker){ const k=h('div','kicker',ev.kicker); k.style.marginBottom='16px'; box.prepend(k); ev.k=k; }
    el.appendChild(box); place(el,ev); return el; },
  update(ev,el,t){ const o=env(ev,t,.2,.3); el.style.opacity=o?1:0; if(!o) return;
    const st=ev.stagger??.09; const out=1-E.inCubic(P(t,ev.t1-.3,.3));
    ev.words.forEach((w,i)=>{ const p=E.outBack(P(t,ev.t0+i*st,.42)); const q=P(t,ev.t0+i*st,.25);
      w.style.opacity=Math.min(q,out); w.style.transform=`translateY(${(1-p)*60 - (1-out)*30}px) scale(${lerp(.7,1,p)})`; w.style.filter=`blur(${(1-q)*10}px)`; });
    if(ev.k){ ev.k.style.opacity=Math.min(P(t,ev.t0,.3),out); }
    if(ev.plate){ const b=el.firstChild; const p=E.outBack(P(t,ev.t0-.05,.4)); b.style.transform=`scale(${lerp(.85,1,p)})`; b.style.opacity=Math.min(P(t,ev.t0-.05,.2),out); }
  }};
C.slam={
  build(ev){ const el=h('div','ev slam',fmt(ev.text)); el.style.fontSize=(ev.size||150)+'px'; place(el,ev); if(ev.sub){ const s=h('div','kicker',ev.sub); s.style.marginTop='18px'; s.style.letterSpacing='5px'; el.appendChild(s);} return el; },
  update(ev,el,t){ const o=env(ev,t,.12,.25); el.style.opacity=o; if(!o) return; const p=E.outExpo(P(t,ev.t0,.35));
    el.style.transform=`scale(${lerp(2.2,1,p)})`; el.style.filter=`blur(${(1-p)*14}px) drop-shadow(0 10px 30px rgba(0,0,0,.6))`; }};
C.chips={
  build(ev){ const el=h('div','ev'); const w=h('div','chips'); ev.els=ev.items.map(it=>{ const c=h('div','chip card'); c.innerHTML=`${icon(it,ev.items.indexOf(it))}<span>${fmt(it.text)}</span>`; w.appendChild(c); return c; }); el.appendChild(w); place(el,ev); return el; },
  update(ev,el,t){ const o=env(ev,t,.01,.3); el.style.opacity=o?1:0; const out=1-E.inCubic(P(t,ev.t1-.3,.3));
    ev.items.forEach((it,i)=>{ const p=E.outBack(P(t,it.t,.45)); const q=P(t,it.t,.18); const c=ev.els[i];
      c.style.opacity=Math.min(q,out); c.style.transform=`translateX(${(1-p)*(i%2?120:-120)}px) scale(${lerp(.6,1,p)})`; }); }};
const XSVG='<svg class="mark" viewBox="0 0 70 70"><circle cx="35" cy="35" r="31" fill="rgba(255,77,94,.15)" stroke="#FF4D5E" stroke-width="4"/><path d="M23 23 L47 47 M47 23 L23 47" stroke="#FF4D5E" stroke-width="7" stroke-linecap="round" fill="none" pathLength="1"/></svg>';
const VSVG='<svg class="mark" viewBox="0 0 70 70"><circle cx="35" cy="35" r="31" fill="rgba(55,245,155,.15)" stroke="#37F59B" stroke-width="4"/><path d="M20 36 L31 47 L51 25" stroke="#37F59B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="1"/></svg>';
C.checklist={
  build(ev){ const el=h('div','ev'); const box=h('div','check card'); if(ev.title){ const k=h('div','kicker',ev.title); k.style.marginBottom='10px'; box.appendChild(k);}
    ev.rows=ev.items.map(it=>{ const r=h('div','row'); r.innerHTML=`<span class="lbl">${fmt(it.text)}</span>${it.mark==='check'?VSVG:XSVG}`; box.appendChild(r); return r; });
    el.appendChild(box); place(el,ev); return el; },
  update(ev,el,t){ const o=env(ev,t,.3,.3); el.style.opacity=o; if(!o) return; el.firstChild.style.transform=`translateY(${(1-E.outCubic(P(t,ev.t0,.4)))*40}px)`;
    ev.items.forEach((it,i)=>{ const r=ev.rows[i]; const p=E.outCubic(P(t,it.t,.35)); r.style.opacity=.08+.92*p; r.style.transform=`translateX(${(1-p)*-40}px)`;
      const m=r.querySelector('svg'); const d=E.outCubic(P(t,it.t+.25,.3)); m.style.transform=`scale(${lerp(.4,1,E.outBack(P(t,it.t+.2,.35)))})`; m.style.opacity=P(t,it.t+.2,.1);
      const pth=m.querySelector('path'); pth.style.strokeDasharray=1; pth.style.strokeDashoffset=1-d; }); }};
C.flow={
  build(ev){ const el=h('div','ev'); const W=ev.w||960, H=ev.h||700; const f=h('div','flow'); f.style.width=W+'px'; f.style.height=H+'px';
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','wires'); svg.setAttribute('width',W); svg.setAttribute('height',H); f.appendChild(svg);
    ev.nodeEls=ev.nodes.map((n,i)=>{ const d=h('div','node card'+(n.target?' target':'')); d.innerHTML=(n.num?`<span class="num">${n.num}</span>`:'')+(n.img?`<span class="ic" style="width:70px;height:70px;border-radius:16px;overflow:hidden"><img src="${n.img}"></span>`:'')+`<span>${fmt(n.text)}${n.sub?`<span class="sub">${n.sub}</span>`:''}</span>`;
      d.style.left=n.x+'px'; d.style.top=n.y+'px'; d.style.transform='translate(-50%,-50%)'; f.appendChild(d); return d; });
    ev.wireEls=(ev.wires||[]).map(w=>{ const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d',w.d); p.setAttribute('pathLength','1'); svg.appendChild(p); return p; });

    const bo=Math.min(P(t,bt.t0,.4), 1-P(t,bt.t1-.3,.3)); const hidden=SPEC.events.some(ev=>!['flash','leak','cta'].includes(ev.type) && (ev.y||0)<300 && t>=ev.t0-.1 && t<=ev.t1+.1);
    b.style.opacity=Math.max(0,bo)*(hidden?0:0.92); }
  document.getElementById('prog').style.opacity=SPEC.progress===false?0:1;
}
window.init=init; window.render=render; window.setLayer=L=>{ document.body.dataset.layer=L; };
</script>
